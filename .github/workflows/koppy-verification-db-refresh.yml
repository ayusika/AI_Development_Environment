name: Koppy Verification DB Refresh

run-name: Verification DB Refresh

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REFRESH_VERIFICATION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: koppy-verification-db-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "REFRESH_VERIFICATION" ]; then
            echo "Confirmation did not match."
            echo "Verification database was not touched."
            false
          fi

      - name: Install sshpass
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi

          timeout 120s sudo apt-get update -o Acquire::Retries=2
          timeout 120s sudo apt-get install -y sshpass

      - name: Refresh verification database
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.LOLIPOP_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
        run: |
          set -euo pipefail

          LOCAL_SCRIPT="600_KoppyOS/server/database/refresh-verification-db.php"
          REMOTE_TOOL_DIR="/home/users/2/her.jp-mikipiano/.koppy-private/tools"
          REMOTE_SCRIPT="$REMOTE_TOOL_DIR/refresh-verification-db.php"
          PRODUCTION_DB="/home/users/2/her.jp-mikipiano/.koppy-private/database/kohaku-work.sqlite"
          VERIFICATION_DB="/home/users/2/her.jp-mikipiano/.koppy-private/database/kohaku-work-verification.sqlite"

          test -f "$LOCAL_SCRIPT"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_TOOL_DIR'"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -O \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            "$LOCAL_SCRIPT" \
            "$SSH_USER@$SSH_HOST:$REMOTE_SCRIPT"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "'/usr/local/php/8.5/bin/php' \
              '$REMOTE_SCRIPT' \
              '$PRODUCTION_DB' \
              '$VERIFICATION_DB'"

      - name: Verification refresh complete
        run: |
          echo "Verification database refresh completed."
          echo "Production database was not replaced."
