name: Deploy Koppy World to Lolipop

on:
  push:
    branches:
      - main
    paths:
      - "900_Lab/Web_KoppyOS_Beta/index.html"
      - "900_Lab/Web_KoppyOS_Beta/kohaku-work/**"
      - "600_KoppyOS/server/api/**"
      - ".github/workflows/deploy-koppy-world-lolipop.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koppy-world-lolipop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy Koppy World
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.LOLIPOP_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
        run: |
          set -euo pipefail

          SOURCE_FILE="900_Lab/Web_KoppyOS_Beta/index.html"
          REMOTE_FILE="/home/users/2/her.jp-mikipiano/web/koppy/index.html"

          KOHAKU_WORK_SOURCE="900_Lab/Web_KoppyOS_Beta/kohaku-work"
          KOHAKU_WORK_REMOTE="/home/users/2/her.jp-mikipiano/web/koppy/kohaku-work"

          API_SOURCE="600_KoppyOS/server/api"
          API_REMOTE="/home/users/2/her.jp-mikipiano/web/koppy/api"

          test -f "$SOURCE_FILE"
          test -d "$KOHAKU_WORK_SOURCE"
          test -d "$API_SOURCE"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$KOHAKU_WORK_REMOTE' '$API_REMOTE'"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SOURCE_FILE" \
            "$SSH_USER@$SSH_HOST:$REMOTE_FILE"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -r \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$KOHAKU_WORK_SOURCE/"* \
            "$SSH_USER@$SSH_HOST:$KOHAKU_WORK_REMOTE/"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -r \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$API_SOURCE/"* \
            "$SSH_USER@$SSH_HOST:$API_REMOTE/"

      - name: Deployment complete
        run: |
          echo "Koppy World deployed successfully."