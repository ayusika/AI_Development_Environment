name: Deploy Koppy World to Lolipop

on:
  push:
    branches:
      - main
    paths:
      - "900_Lab/Web_KoppyOS_Beta/index.html"
      - "900_Lab/Web_KoppyOS_Beta/kohaku-work/**"
      - "600_KoppyOS/server/api/**"
      - "600_KoppyOS/server/database/migrate-sales-v2.php"
      - "600_KoppyOS/server/database/migrate-sapporo-rates-v2.php"
      - "600_KoppyOS/server/database/migrate-customer-name-kashikoi.php"
      - ".github/workflows/deploy-koppy-world-lolipop.yml"

  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run Kohaku Work database migrations"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: koppy-world-lolipop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install sshpass
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi

          timeout 120s sudo apt-get update -o Acquire::Retries=2
          timeout 120s sudo apt-get install -y sshpass

      - name: Deploy Koppy World
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.LOLIPOP_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
          RUN_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations }}

        run: |
          set -euo pipefail

          SOURCE_FILE="900_Lab/Web_KoppyOS_Beta/index.html"
          REMOTE_FILE="/home/users/2/her.jp-mikipiano/web/koppy/index.html"

          KOHAKU_WORK_SOURCE="900_Lab/Web_KoppyOS_Beta/kohaku-work"
          KOHAKU_WORK_REMOTE="/home/users/2/her.jp-mikipiano/web/koppy/kohaku-work"

          API_SOURCE="600_KoppyOS/server/api"
          API_REMOTE="/home/users/2/her.jp-mikipiano/web/koppy/api"

          test -f "$SOURCE_FILE"
          test -d "$KOHAKU_WORK_SOURCE"
          test -d "$API_SOURCE"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$KOHAKU_WORK_REMOTE' '$API_REMOTE'"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -P "$SSH_PORT" \
            -O \
            -o StrictHostKeyChecking=accept-new \
            "$SOURCE_FILE" \
            "$SSH_USER@$SSH_HOST:$REMOTE_FILE"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -O \
            -r \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$KOHAKU_WORK_SOURCE/"* \
            "$SSH_USER@$SSH_HOST:$KOHAKU_WORK_REMOTE/"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -O \
            -r \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$API_SOURCE/"* \
            "$SSH_USER@$SSH_HOST:$API_REMOTE/"

          if [ "$RUN_MIGRATIONS" = "true" ]; then

            sshpass -p "$SSH_PASSWORD" \
              ssh \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p '/home/users/2/her.jp-mikipiano/.koppy-private/migrations'"

            sshpass -p "$SSH_PASSWORD" \
              scp \
              -O \
              -P "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "600_KoppyOS/server/database/migrate-sales-v2.php" \
              "$SSH_USER@$SSH_HOST:/home/users/2/her.jp-mikipiano/.koppy-private/migrations/migrate-sales-v2.php"

            sshpass -p "$SSH_PASSWORD" \
              ssh \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "'/usr/local/php/8.5/bin/php' \
              '/home/users/2/her.jp-mikipiano/.koppy-private/migrations/migrate-sales-v2.php' \
              '/home/users/2/her.jp-mikipiano/.koppy-private/database/kohaku-work.sqlite'"

            sshpass -p "$SSH_PASSWORD" \
              scp \
              -O \
              -P "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "600_KoppyOS/server/database/migrate-sapporo-rates-v2.php" \
              "$SSH_USER@$SSH_HOST:/home/users/2/her.jp-mikipiano/.koppy-private/migrations/migrate-sapporo-rates-v2.php"

            sshpass -p "$SSH_PASSWORD" \
              ssh \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "'/usr/local/php/8.5/bin/php' \
              '/home/users/2/her.jp-mikipiano/.koppy-private/migrations/migrate-sapporo-rates-v2.php' \
              '/home/users/2/her.jp-mikipiano/.koppy-private/database/kohaku-work.sqlite'"

            sshpass -p "$SSH_PASSWORD" \
              scp \
              -O \
              -P "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "600_KoppyOS/server/database/migrate-customer-name-kashikoi.php" \
              "$SSH_USER@$SSH_HOST:/home/users/2/her.jp-mikipiano/.koppy-private/migrations/migrate-customer-name-kashikoi.php"

            sshpass -p "$SSH_PASSWORD" \
              ssh \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" \
              "'/usr/local/php/8.5/bin/php' \
              '/home/users/2/her.jp-mikipiano/.koppy-private/migrations/migrate-customer-name-kashikoi.php' \
              '/home/users/2/her.jp-mikipiano/.koppy-private/database/kohaku-work.sqlite'"

          fi

      - name: Deployment complete
        run: |
          echo "Koppy World deployed successfully."