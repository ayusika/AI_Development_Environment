name: Koppy DB Migration

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('DB Migration: {0}', inputs.migration)
      || 'DB Migration detected' }}

on:
  push:
    branches:
      - main
    paths:
      - "600_KoppyOS/server/database/migrate-*.php"
      - ".github/workflows/koppy-db-migration.yml"

  workflow_dispatch:
    inputs:
      migration:
        description: "Migration to run"
        required: true
        type: choice
        options:
          - migrate-heaven-diaries.php
          - migrate-heaven-diary-drafts.php
          - migrate-customer-name-kashikoi.php
          - migrate-sales-v2.php
          - migrate-sapporo-rates-v2.php

permissions:
  contents: read

concurrency:
  group: koppy-db-migration
  cancel-in-progress: false

jobs:
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Migration file detected
        run: |
          echo "Database migration related files changed."
          echo ""
          echo "No database migration was executed automatically."
          echo "Use Run workflow when you want to apply a migration."

  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install sshpass
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi

          timeout 120s sudo apt-get update -o Acquire::Retries=2
          timeout 120s sudo apt-get install -y sshpass

      - name: Run selected migration
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.LOLIPOP_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
          MIGRATION_FILE: ${{ inputs.migration }}

        run: |
          set -euo pipefail

          MIGRATION_STATUS_REMOTE_DIR="/home/users/2/her.jp-mikipiano/web/koppy/deploy-status"
          MIGRATION_STATUS_REMOTE_FILE="$MIGRATION_STATUS_REMOTE_DIR/migration.json"
          MIGRATION_STATUS_REMOTE_TEMP="/home/users/2/her.jp-mikipiano/koppy-migration-status-${GITHUB_RUN_ID}.json"
          MIGRATION_STATUS_LOCAL_FILE="$RUNNER_TEMP/koppy-migration-status.json"

          publish_migration_status() {
            local migration_status="$1"
            local updated_at

            updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            printf \
              '{"status":"%s","sha":"%s","run_id":"%s","run_number":"%s","migration":"%s","updated_at":"%s"}\n' \
              "$migration_status" \
              "$GITHUB_SHA" \
              "$GITHUB_RUN_ID" \
              "$GITHUB_RUN_NUMBER" \
              "$MIGRATION_FILE" \
              "$updated_at" \
              > "$MIGRATION_STATUS_LOCAL_FILE"

            if ! sshpass -p "$SSH_PASSWORD" \
              scp \
              -P "$SSH_PORT" \
              -O \
              -o StrictHostKeyChecking=accept-new \
              -o UpdateHostKeys=no \
              -o ConnectTimeout=20 \
              "$MIGRATION_STATUS_LOCAL_FILE" \
              "$SSH_USER@$SSH_HOST:$MIGRATION_STATUS_REMOTE_TEMP"; then

              echo "Migration status upload failed."

              return 0
            fi

            if ! sshpass -p "$SSH_PASSWORD" \
              ssh \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o UpdateHostKeys=no \
              -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$MIGRATION_STATUS_REMOTE_DIR'
              mv '$MIGRATION_STATUS_REMOTE_TEMP' '$MIGRATION_STATUS_REMOTE_FILE'"; then

              echo "Migration status publish failed."
            fi

            return 0
          }

          finish_migration_status() {
            local migration_exit_code="$?"

            trap - EXIT

            if [ "$migration_exit_code" -eq 0 ]; then
              publish_migration_status "success"
            else
              publish_migration_status "failure"
            fi

            exit "$migration_exit_code"
          }

          trap finish_migration_status EXIT

          publish_migration_status "running"

          LOCAL_FILE="600_KoppyOS/server/database/$MIGRATION_FILE"

          REMOTE_DIR="/home/users/2/her.jp-mikipiano/.koppy-private/migrations"

          REMOTE_FILE="$REMOTE_DIR/$MIGRATION_FILE"

          DATABASE_FILE="/home/users/2/her.jp-mikipiano/.koppy-private/database/kohaku-work.sqlite"

          test -f "$LOCAL_FILE"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_DIR'"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -O \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            "$LOCAL_FILE" \
            "$SSH_USER@$SSH_HOST:$REMOTE_FILE"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            "$SSH_USER@$SSH_HOST" \
            "'/usr/local/php/8.5/bin/php' \
            '$REMOTE_FILE' \
            '$DATABASE_FILE'"

      - name: Migration complete
        run: |
          echo "Migration completed successfully:"
          echo "${{ inputs.migration }}"