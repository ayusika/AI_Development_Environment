name: Koppy DB Migration

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('DB Migration: {0}', inputs.migration)
      || 'DB Migration detected' }}

on:
  push:
    branches:
      - main
    paths:
      - "600_KoppyOS/server/database/migrate-*.php"
      - ".github/workflows/koppy-db-migration.yml"

  workflow_dispatch:
    inputs:
      migration:
        description: "Migration to run"
        required: true
        type: choice
        options:
          - migrate-heaven-diaries.php
          - migrate-customer-name-kashikoi.php
          - migrate-sales-v2.php
          - migrate-sapporo-rates-v2.php

permissions:
  contents: read

concurrency:
  group: koppy-db-migration
  cancel-in-progress: false

jobs:
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Migration file detected
        run: |
          echo "Database migration related files changed."
          echo ""
          echo "No database migration was executed automatically."
          echo "Use Run workflow when you want to apply a migration."

  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install sshpass
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi

          timeout 120s sudo apt-get update -o Acquire::Retries=2
          timeout 120s sudo apt-get install -y sshpass

      - name: Run selected migration
        env:
          SSH_HOST: ${{ secrets.LOLIPOP_SSH_HOST }}
          SSH_USER: ${{ secrets.LOLIPOP_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.LOLIPOP_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.LOLIPOP_SSH_PORT }}
          MIGRATION_FILE: ${{ inputs.migration }}

        run: |
          set -euo pipefail

          LOCAL_FILE="600_KoppyOS/server/database/$MIGRATION_FILE"

          REMOTE_DIR="/home/users/2/her.jp-mikipiano/.koppy-private/migrations"

          REMOTE_FILE="$REMOTE_DIR/$MIGRATION_FILE"

          DATABASE_FILE="/home/users/2/her.jp-mikipiano/.koppy-private/database/kohaku-work.sqlite"

          test -f "$LOCAL_FILE"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_DIR'"

          sshpass -p "$SSH_PASSWORD" \
            scp \
            -O \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            "$LOCAL_FILE" \
            "$SSH_USER@$SSH_HOST:$REMOTE_FILE"

          sshpass -p "$SSH_PASSWORD" \
            ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o UpdateHostKeys=no \
            "$SSH_USER@$SSH_HOST" \
            "'/usr/local/php/8.5/bin/php' \
            '$REMOTE_FILE' \
            '$DATABASE_FILE'"

      - name: Migration complete
        run: |
          echo "Migration completed successfully:"
          echo "${{ inputs.migration }}"