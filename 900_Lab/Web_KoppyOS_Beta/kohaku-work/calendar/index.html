<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>共有カレンダー | Koppy World</title>

  <link
    rel="stylesheet"
    href="./calendar.css"
  >
</head>

<body>

  <main class="calendar-app">

    <header class="calendar-header">

      <div>
        <p class="calendar-brand">
          KOPPY WORLD
        </p>

        <h1>
          共有カレンダー
        </h1>
      </div>

      <div class="calendar-header-actions">

        <button
          type="button"
          data-calendar-today
        >
          今日
        </button>

      </div>

    </header>


    <section class="calendar-toolbar">

      <button
        type="button"
        data-calendar-move="-1"
        aria-label="前の月"
      >
        ‹
      </button>

      <div class="calendar-month-heading">

        <div class="calendar-month-navigation">

          <h2 id="calendar-month-title">
            読み込み中…
          </h2>

          <div
            class="calendar-month-jump"
            aria-label="表示年月を選択"
          >

            <select
              data-calendar-year-select
              aria-label="年を選択"
            ></select>

            <span class="calendar-month-jump-unit">
              年
            </span>

            <select
              data-calendar-month-select
              aria-label="月を選択"
            >
              <option value="0">1</option>
              <option value="1">2</option>
              <option value="2">3</option>
              <option value="3">4</option>
              <option value="4">5</option>
              <option value="5">6</option>
              <option value="6">7</option>
              <option value="7">8</option>
              <option value="8">9</option>
              <option value="9">10</option>
              <option value="10">11</option>
              <option value="11">12</option>
            </select>

            <span class="calendar-month-jump-unit">
              月
            </span>

          </div>

        </div>

        <div
          class="calendar-person-legend"
          aria-label="予定の色分け"
        >
          <span
            class="calendar-person-legend-item"
            data-worker-code="ui"
          >
            うい
          </span>

          <span
            class="calendar-person-legend-item"
            data-worker-code="shii"
          >
            しい
          </span>
        </div>

      </div>

      <button
        type="button"
        data-calendar-move="1"
        aria-label="次の月"
      >
        ›
      </button>

    </section>


    <section
      class="month-calendar"
      id="month-calendar"
    >
      カレンダーを読み込んでいます…
    </section>

  </main>


  <div
    class="calendar-event-modal"
    data-event-modal
    hidden
  >
    <div
      class="calendar-event-modal-backdrop"
      data-event-modal-close
    ></div>

    <section
      class="calendar-event-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="calendar-event-dialog-title"
    >

      <header class="calendar-event-dialog-header">

        <div>
          <p class="calendar-event-dialog-date">
            <span data-event-date-label></span>
          </p>

          <h2 id="calendar-event-dialog-title">
            予定を追加
          </h2>
        </div>

        <button
          type="button"
          class="calendar-event-close"
          data-event-modal-close
          aria-label="閉じる"
        >
          ×
        </button>

      </header>


      <form
        class="calendar-event-form"
        data-event-form
      >

        <input
          type="hidden"
          name="event_date"
          data-event-date
        >

        <input
          type="hidden"
          name="event_id"
          data-event-id
        >


        <label class="calendar-event-field">
          <span>だれの予定？</span>

          <select
            name="owner_code"
            data-event-owner
            required
          >
            <option value="ui">
              うい
            </option>

            <option value="shii">
              しい
            </option>

            <option value="shared">
              共通
            </option>
          </select>
        </label>


        <label class="calendar-event-field">
          <span>予定</span>

          <input
            type="text"
            name="title"
            maxlength="120"
            placeholder="美容室、病院、荷物受取など"
            required
          >
        </label>


        <section
          class="calendar-repeat-panel"
          data-repeat-panel
        >

          <label class="calendar-event-field">
            <span>
              繰り返し
            </span>

            <select
              name="repeat_type"
              data-repeat-type
            >
              <option value="none">
                なし
              </option>

              <option value="daily">
                毎日 / ○日おき
              </option>

              <option value="weekly">
                毎週 / ○週おき
              </option>

              <option value="monthly_day">
                毎月 ○日
              </option>

              <option value="monthly_weekday">
                毎月 第○曜日
              </option>

              <option value="yearly">
                毎年
              </option>
            </select>
          </label>


          <div
            class="calendar-repeat-details"
            data-repeat-details
            hidden
          >

            <label
              class="calendar-event-field"
              data-repeat-interval-field
              hidden
            >
              <span>
                間隔
              </span>

              <div class="calendar-repeat-inline">
                <input
                  type="number"
                  name="repeat_interval"
                  value="1"
                  min="1"
                  max="365"
                  inputmode="numeric"
                  data-repeat-interval
                >

                <span
                  class="calendar-repeat-unit"
                  data-repeat-interval-unit
                >
                  日ごと
                </span>
              </div>
            </label>


            <fieldset
              class="calendar-repeat-weekdays"
              data-repeat-weekdays-field
              hidden
            >
              <legend>
                曜日
              </legend>

              <label>
                <input
                  type="checkbox"
                  name="repeat_weekdays"
                  value="0"
                >
                日
              </label>

              <label>
                <input
                  type="checkbox"
                  name="repeat_weekdays"
                  value="1"
                >
                月
              </label>

              <label>
                <input
                  type="checkbox"
                  name="repeat_weekdays"
                  value="2"
                >
                火
              </label>

              <label>
                <input
                  type="checkbox"
                  name="repeat_weekdays"
                  value="3"
                >
                水
              </label>

              <label>
                <input
                  type="checkbox"
                  name="repeat_weekdays"
                  value="4"
                >
                木
              </label>

              <label>
                <input
                  type="checkbox"
                  name="repeat_weekdays"
                  value="5"
                >
                金
              </label>

              <label>
                <input
                  type="checkbox"
                  name="repeat_weekdays"
                  value="6"
                >
                土
              </label>
            </fieldset>


            <label
              class="calendar-event-field"
              data-repeat-month-day-field
              hidden
            >
              <span>
                日
              </span>

              <div class="calendar-repeat-inline">
                <input
                  type="number"
                  name="repeat_day_of_month"
                  min="1"
                  max="31"
                  inputmode="numeric"
                  data-repeat-day-of-month
                >

                <span class="calendar-repeat-unit">
                  日
                </span>
              </div>
            </label>


            <div
              class="calendar-event-time-row"
              data-repeat-month-weekday-field
              hidden
            >

              <label class="calendar-event-field">
                <span>
                  週
                </span>

                <select
                  name="repeat_week_of_month"
                  data-repeat-week-of-month
                >
                  <option value="1">
                    第1
                  </option>

                  <option value="2">
                    第2
                  </option>

                  <option value="3">
                    第3
                  </option>

                  <option value="4">
                    第4
                  </option>

                  <option value="5">
                    第5
                  </option>

                  <option value="-1">
                    最終
                  </option>
                </select>
              </label>


              <label class="calendar-event-field">
                <span>
                  曜日
                </span>

                <select
                  name="repeat_weekday"
                  data-repeat-weekday
                >
                  <option value="0">
                    日曜日
                  </option>

                  <option value="1">
                    月曜日
                  </option>

                  <option value="2">
                    火曜日
                  </option>

                  <option value="3">
                    水曜日
                  </option>

                  <option value="4">
                    木曜日
                  </option>

                  <option value="5">
                    金曜日
                  </option>

                  <option value="6">
                    土曜日
                  </option>
                </select>
              </label>

            </div>


            <div
              class="calendar-event-time-row"
              data-repeat-yearly-field
              hidden
            >

              <label class="calendar-event-field">
                <span>
                  月
                </span>

                <input
                  type="number"
                  name="repeat_month"
                  min="1"
                  max="12"
                  inputmode="numeric"
                  data-repeat-month
                >
              </label>


              <label class="calendar-event-field">
                <span>
                  日
                </span>

                <input
                  type="number"
                  name="repeat_yearly_day"
                  min="1"
                  max="31"
                  inputmode="numeric"
                  data-repeat-yearly-day
                >
              </label>

            </div>


            <label class="calendar-event-field">
              <span>
                繰り返しの終了
              </span>

              <select
                name="repeat_end_type"
                data-repeat-end-type
              >
                <option value="none">
                  終了しない
                </option>

                <option value="date">
                  日付まで
                </option>

                <option value="count">
                  回数を指定
                </option>
              </select>
            </label>


            <label
              class="calendar-event-field"
              data-repeat-end-date-field
              hidden
            >
              <span>
                繰り返し終了日
              </span>

              <input
                type="date"
                name="repeat_end_date"
                data-repeat-end-date
              >
            </label>


            <label
              class="calendar-event-field"
              data-repeat-count-field
              hidden
            >
              <span>
                回数
              </span>

              <div class="calendar-repeat-inline">
                <input
                  type="number"
                  name="repeat_count"
                  min="1"
                  max="1000"
                  inputmode="numeric"
                  data-repeat-count
                >

                <span class="calendar-repeat-unit">
                  回
                </span>
              </div>
            </label>

          </div>

        </section>


        <label class="calendar-event-all-day">
          <input
            type="checkbox"
            name="all_day"
            value="1"
            data-event-all-day
          >

          <span>
            終日
          </span>
        </label>


        <label class="calendar-event-all-day">
          <input
            type="checkbox"
            data-event-multi-day
          >

          <span>
            複数日にまたがる予定
          </span>
        </label>


        <label
          class="calendar-event-field"
          data-event-end-date-field
          hidden
        >
          <span>
            予定の終了日
          </span>

          <input
            type="date"
            name="end_date"
            data-event-end-date
          >
        </label>


        <label class="calendar-event-field">
          <span>
            文字色
          </span>

          <input
            type="color"
            name="text_color"
            value="#29485a"
            data-event-text-color
          >
        </label>


        <div
          class="calendar-color-palette"
          data-color-palette
        >
          <span class="calendar-color-palette-label">
            登録パレット
          </span>

          <div
            class="calendar-color-palette-items"
            data-color-palette-items
          ></div>

          <button
            type="button"
            class="calendar-color-palette-add"
            data-color-palette-add
            aria-label="現在の文字色をパレットに登録"
          >
            ＋
          </button>
        </div>


        <div class="calendar-event-time-row">

          <label class="calendar-event-field">
            <span>開始</span>

            <input
              type="time"
              name="start_time"
              data-event-start-time
            >
          </label>


          <label class="calendar-event-field">
            <span>終了</span>

            <input
              type="time"
              name="end_time"
              data-event-end-time
            >
          </label>

        </div>


        <label class="calendar-event-field">
          <span>カテゴリ</span>

          <input
            type="text"
            name="category"
            placeholder="任意"
          >
        </label>


        <label class="calendar-event-field">
          <span>メモ</span>

          <textarea
            name="memo"
            rows="3"
            placeholder="任意"
          ></textarea>
        </label>


        <p
          class="calendar-event-form-message"
          data-event-message
        ></p>


        <div class="calendar-event-form-actions">

          <button
            type="button"
            class="calendar-event-delete"
            data-event-delete
            hidden
          >
            削除
          </button>

          <button
            type="button"
            class="calendar-event-cancel"
            data-event-modal-close
          >
            キャンセル
          </button>

          <button
            type="submit"
            class="calendar-event-save"
          >
            保存
          </button>

        </div>

      </form>

    </section>
  </div>


  <script src="./calendar.js"></script>

</body>

</html>
