<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>共有カレンダー | Koppy World</title>

  <link
    rel="stylesheet"
    href="./calendar.css"
  >
</head>

<body>

  <main class="calendar-app">

    <header class="calendar-header">

      <div>
        <p class="calendar-brand">
          KOPPY WORLD
        </p>

        <h1>
          共有カレンダー
        </h1>
      </div>

      <div class="calendar-header-actions">

        <button
          type="button"
          data-calendar-today
        >
          今日
        </button>

      </div>

    </header>


    <section class="calendar-toolbar">

      <button
        type="button"
        data-calendar-move="-1"
        aria-label="前の月"
      >
        ‹
      </button>

      <div class="calendar-month-heading">

        <h2 id="calendar-month-title">
          読み込み中…
        </h2>

        <div
          class="calendar-person-legend"
          aria-label="予定の色分け"
        >
          <span
            class="calendar-person-legend-item"
            data-worker-code="ui"
          >
            うい
          </span>

          <span
            class="calendar-person-legend-item"
            data-worker-code="shii"
          >
            しい
          </span>
        </div>

      </div>

      <button
        type="button"
        data-calendar-move="1"
        aria-label="次の月"
      >
        ›
      </button>

    </section>


    <section
      class="month-calendar"
      id="month-calendar"
    >
      カレンダーを読み込んでいます…
    </section>

  </main>


  <div
    class="calendar-event-modal"
    data-event-modal
    hidden
  >
    <div
      class="calendar-event-modal-backdrop"
      data-event-modal-close
    ></div>

    <section
      class="calendar-event-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="calendar-event-dialog-title"
    >

      <header class="calendar-event-dialog-header">

        <div>
          <p class="calendar-event-dialog-date">
            <span data-event-date-label></span>
          </p>

          <h2 id="calendar-event-dialog-title">
            予定を追加
          </h2>
        </div>

        <button
          type="button"
          class="calendar-event-close"
          data-event-modal-close
          aria-label="閉じる"
        >
          ×
        </button>

      </header>


      <form
        class="calendar-event-form"
        data-event-form
      >

        <input
          type="hidden"
          name="event_date"
          data-event-date
        >

        <input
          type="hidden"
          name="event_id"
          data-event-id
        >


        <label class="calendar-event-field">
          <span>だれの予定？</span>

          <select
            name="owner_code"
            data-event-owner
            required
          >
            <option value="ui">
              うい
            </option>

            <option value="shii">
              しい
            </option>

            <option value="shared">
              共通
            </option>
          </select>
        </label>


        <label class="calendar-event-field">
          <span>予定</span>

          <input
            type="text"
            name="title"
            maxlength="120"
            placeholder="美容室、病院、荷物受取など"
            required
          >
        </label>


        <label class="calendar-event-all-day">
          <input
            type="checkbox"
            name="all_day"
            value="1"
            data-event-all-day
          >

          <span>
            終日
          </span>
        </label>


        <label class="calendar-event-field">
          <span>
            終了日
          </span>

          <input
            type="date"
            name="end_date"
            data-event-end-date
          >
        </label>


        <label class="calendar-event-field">
          <span>
            文字色
          </span>

          <input
            type="color"
            name="text_color"
            value="#29485a"
            data-event-text-color
          >
        </label>


        <div
          class="calendar-color-palette"
          data-color-palette
        >
          <span class="calendar-color-palette-label">
            登録パレット
          </span>

          <div
            class="calendar-color-palette-items"
            data-color-palette-items
          ></div>
        </div>


        <div class="calendar-event-time-row">

          <label class="calendar-event-field">
            <span>開始</span>

            <input
              type="time"
              name="start_time"
              data-event-start-time
            >
          </label>


          <label class="calendar-event-field">
            <span>終了</span>

            <input
              type="time"
              name="end_time"
              data-event-end-time
            >
          </label>

        </div>


        <label class="calendar-event-field">
          <span>カテゴリ</span>

          <input
            type="text"
            name="category"
            placeholder="任意"
          >
        </label>


        <label class="calendar-event-field">
          <span>メモ</span>

          <textarea
            name="memo"
            rows="3"
            placeholder="任意"
          ></textarea>
        </label>


        <p
          class="calendar-event-form-message"
          data-event-message
        ></p>


        <div class="calendar-event-form-actions">

          <button
            type="button"
            class="calendar-event-delete"
            data-event-delete
            hidden
          >
            削除
          </button>

          <button
            type="button"
            class="calendar-event-cancel"
            data-event-modal-close
          >
            キャンセル
          </button>

          <button
            type="submit"
            class="calendar-event-save"
          >
            保存
          </button>

        </div>

      </form>

    </section>
  </div>


  <script src="./calendar.js"></script>

</body>

</html>
