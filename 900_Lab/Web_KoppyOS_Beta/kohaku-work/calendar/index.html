<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>共有カレンダー | Koppy World</title>

  <link
    rel="stylesheet"
    href="./calendar.css"
  >
</head>

<body>

  <main class="calendar-app">

    <header class="calendar-header">

      <div>
        <p class="calendar-brand">
          KOPPY WORLD
        </p>

        <h1>
          共有カレンダー
        </h1>
      </div>

      <div class="calendar-header-actions">

        <button
          type="button"
          data-calendar-today
        >
          今日
        </button>

      </div>

    </header>


    <section class="calendar-toolbar">

      <button
        type="button"
        data-calendar-move="-1"
        aria-label="前の月"
      >
        ‹
      </button>

      <div class="calendar-month-heading">

        <h2 id="calendar-month-title">
          読み込み中…
        </h2>

        <div
          class="calendar-person-legend"
          aria-label="予定の色分け"
        >
          <span
            class="calendar-person-legend-item"
            data-worker-code="ui"
          >
            うい
          </span>

          <span
            class="calendar-person-legend-item"
            data-worker-code="shii"
          >
            しい
          </span>
        </div>

      </div>

      <button
        type="button"
        data-calendar-move="1"
        aria-label="次の月"
      >
        ›
      </button>

    </section>


    <section
      class="month-calendar"
      id="month-calendar"
    >
      カレンダーを読み込んでいます…
    </section>

  </main>


  <script src="./calendar.js"></script>

</body>

</html>
