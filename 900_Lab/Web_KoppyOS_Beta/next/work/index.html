<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Kohaku Work NEXT | Koppy World NEXT</title>

  <link rel="stylesheet" href="/assets/css/world-frame-tokens.css">
  <link rel="stylesheet" href="/assets/css/world-frame.css">
  <link rel="stylesheet" href="/assets/css/world-frame-polish.css">
  <link rel="stylesheet" href="/assets/css/world-frame-shell.css">
  <link rel="stylesheet" href="/assets/css/world-frame-atmosphere.css">
  <link rel="stylesheet" href="/assets/css/world-frame-components.css">
  <link rel="stylesheet" href="/assets/css/world-frame-chrome.css">
  <link rel="stylesheet" href="/assets/css/world-frame-utility.css">
  <link rel="stylesheet" href="/next/_shared/scaffold.css">
</head>

<body
  class="world-frame-body"
  data-wf-profile="work"
  data-wf-layout="app"
  data-wf-refresh="off"
>
  <div
    class="wf-app"
    id="wfApp"
    data-theme="electric"
    data-motion="normal"
    data-wf-page="work"
    data-wf-seed="7301"
    data-wf-density=".78"
    data-wf-quality="balanced"
    data-wf-readable-zone="on"
  >

    <div
      class="wf-stage next-app-ambient"
      data-wf-ambient
      data-wf-atmosphere-host
      aria-hidden="true"
    >
      <div class="wf-layer wf-layer--outer">
        <div class="wf-stars" data-layer="stars"></div>
        <div class="wf-streams" data-layer="streams"></div>
        <div class="wf-logs" data-layer="logs"></div>
        <div class="wf-crystals" data-layer="crystals"></div>
      </div>
    </div>

    <div
      class="next-app"
      data-wf-content
    >

      <header class="next-app-header">

        <a href="/next/">
          ◇K Koppy World NEXT
        </a>

        <span>
          WORK / APP MODE
        </span>

      </header>

      <main class="next-app-main">

        <section
          class="next-app-card"
          data-wf-panel
          data-wf-panel-surface
        >

          <p class="wf-eyebrow">
            WORK / NEXT BUILD
          </p>

          <h1>
            Kohaku Work NEXT
          </h1>

          <p class="next-hero-copy">
            現行Kohaku Workを動く仕様書として、同等機能をApp Mode上へ再構築する。
          </p>

          <span class="next-status">
            APP MODE READY
          </span>

          <div class="wf-chip-row">
            <span class="wf-chip">
              NO SHELL
            </span>

            <span class="wf-chip">
              APP OWNS LAYOUT
            </span>

            <span class="wf-chip">
              PARALLEL BUILD
            </span>
          </div>

          <a
            class="wf-action"
            href="/kohaku-work/"
          >
            現行Kohaku Workを開く
            <span>→</span>
          </a>

        </section>

      </main>

    </div>

  </div>

  <script src="/assets/js/world-frame.js"></script>
  <script src="/assets/js/world-frame-polish.js"></script>
  <script src="/assets/js/world-frame-shell.js"></script>
  <script src="/assets/js/world-frame-atmosphere.js"></script>
  <script src="/assets/js/world-frame-profiles.js"></script>
  <script src="/assets/js/world-frame-runtime.js"></script>
  <script src="/assets/js/world-frame-utility.js"></script>
</body>
</html>
